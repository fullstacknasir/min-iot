openapi: 3.0.3
info:
  title: minIoT Platform API
  description: Multi-tenant IoT Platform REST API for device management, authentication, and time-series telemetry.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development API Server

paths:
  # ----------------------------------------------------------------------
  # Authentication Endpoints
  # ----------------------------------------------------------------------
  /auth/register:
    post:
      summary: Register organization and admin user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_name, email, password]
              properties:
                organization_name:
                  type: string
                  example: Acme IoT Corp
                email:
                  type: string
                  format: email
                  example: admin@acme.io
                password:
                  type: string
                  format: password
                  example: SecurePass123!
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      summary: User login (rate-limited)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@miniot.io
                password:
                  type: string
                  format: password
                  example: AdminPassword123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/refresh:
    post:
      summary: Refresh JWT access token with token rotation
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/logout:
    post:
      summary: Revoke refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Logged out successfully

  # ----------------------------------------------------------------------
  # Device Management Endpoints
  # ----------------------------------------------------------------------
  /devices:
    get:
      summary: List organization devices
      tags: [Devices]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
    post:
      summary: Create new device (admin, operator)
      tags: [Devices]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, device_type]
              properties:
                id:
                  type: string
                  example: dev-sensor-101
                name:
                  type: string
                  example: Factory Floor Sensor
                device_type:
                  type: string
                  example: temperature_humidity
                metadata:
                  type: object
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

  /devices/{id}:
    get:
      summary: Get device details
      tags: [Devices]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
    put:
      summary: Update device
      tags: [Devices]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                device_type:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Device updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
    delete:
      summary: Delete device
      tags: [Devices]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device deleted

  /devices/{id}/credentials:
    get:
      summary: Get active credential metadata (hash masked)
      tags: [Devices]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential metadata
    post:
      summary: Provision new device credentials (raw secret returned once)
      tags: [Devices]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Credentials provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id:
                    type: string
                  token:
                    type: string
                    example: dsec_9a8b7c6d...
                  notice:
                    type: string

  /devices/{id}/enable:
    post:
      summary: Enable device
      tags: [Devices]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device enabled

  /devices/{id}/disable:
    post:
      summary: Disable device (rejects connections)
      tags: [Devices]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device disabled

  /devices/{id}/revoke:
    post:
      summary: Revoke device
      tags: [Devices]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device revoked

  # ----------------------------------------------------------------------
  # Organization-Scoped Telemetry Endpoints
  # ----------------------------------------------------------------------
  /devices/{id}/telemetry/latest:
    get:
      summary: Get latest telemetry values for device
      description: Returns the real-time cached telemetry from Redis with TimescaleDB fallback. Strictly scoped to the authenticated organization.
      tags: [Telemetry]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: string
      responses:
        '200':
          description: Latest telemetry
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id:
                    type: string
                  data:
                    type: object
        '404':
          description: Device not found in organization

  /devices/{id}/telemetry/history:
    get:
      summary: Query time-range telemetry points
      description: Queries TimescaleDB hypertable for raw historical telemetry points scoped to the caller's organization.
      tags: [Telemetry]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: metric
          in: query
          required: false
          description: Filter by metric name (e.g. temperature, humidity)
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Start of time range in RFC3339 format (e.g. 2026-10-18T00:00:00Z)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: End of time range in RFC3339 format (e.g. 2026-10-19T00:00:00Z)
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: Historical telemetry points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistoryResponse'
        '404':
          description: Device not found in organization

  /devices/{id}/telemetry/aggregates:
    get:
      summary: Query time-bucketed aggregates (avg, min, max, count)
      description: Computes aggregated time-series metrics over arbitrary time buckets (e.g. '15 minutes', '1 hour', '1 day') using TimescaleDB hypertable time_bucket. Strictly organization-scoped.
      tags: [Telemetry]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: bucket
          in: query
          required: false
          description: Time bucket duration interval (e.g. '15 minutes', '1 hour', '1 day')
          schema:
            type: string
            default: 1 hour
        - name: metric
          in: query
          required: false
          description: Filter by metric name
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Aggregated telemetry buckets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryAggregatesResponse'
        '404':
          description: Device not found in organization

  /devices/{id}/telemetry/live:
    get:
      summary: Stream live telemetry via Server-Sent Events (SSE)
      description: Opens a persistent Server-Sent Events connection streaming live telemetry events for an authorized device. Authenticate via Bearer header or '?token=' query parameter.
      tags: [Telemetry]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: JWT access token query parameter alternative for browser EventSource
          schema:
            type: string
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: initial
                  data: {"device_id":"dev-1","metrics":{"temperature":23.5}}

                  event: telemetry
                  data: {"device_id":"dev-1","metrics":{"temperature":23.7}}
        '401':
          description: Unauthorized
        '404':
          description: Device not found in organization

  /telemetry:
    post:
      summary: Direct HTTP telemetry ingestion
      tags: [Telemetry]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, metrics]
              properties:
                device_id:
                  type: string
                timestamp:
                  type: string
                  format: date-time
                metrics:
                  type: object
                  additionalProperties:
                    type: number
      responses:
        '202':
          description: Telemetry accepted for ingestion

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            role:
              type: string
            organization_id:
              type: string

    Device:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        device_type:
          type: string
        status:
          type: string
          enum: [online, offline, disabled, revoked]
        last_seen:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TelemetryDataPoint:
      type: object
      properties:
        time:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        device_id:
          type: string
        metric_name:
          type: string
        metric_value:
          type: number
        string_value:
          type: string

    TelemetryHistoryResponse:
      type: object
      properties:
        device_id:
          type: string
        count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryDataPoint'

    TelemetryAggregatePoint:
      type: object
      properties:
        bucket:
          type: string
          format: date-time
        device_id:
          type: string
        metric_name:
          type: string
        avg_value:
          type: number
        min_value:
          type: number
        max_value:
          type: number
        count_value:
          type: integer

    TelemetryAggregatesResponse:
      type: object
      properties:
        device_id:
          type: string
        bucket:
          type: string
        count:
          type: integer
        aggregates:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryAggregatePoint'
