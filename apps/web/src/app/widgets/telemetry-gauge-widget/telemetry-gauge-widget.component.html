<section class="flex flex-col h-full rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition-colors dark:border-slate-800 dark:bg-slate-900/80">
  <!-- Widget Header -->
  <header class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800/80">
    <div class="flex items-center gap-2">
      <div class="flex h-7 w-7 items-center justify-center rounded-lg bg-cyan-50 text-cyan-600 dark:bg-cyan-500/10 dark:text-cyan-400">
        <mat-icon class="text-sm">speed</mat-icon>
      </div>
      <div>
        <div class="text-xs font-bold text-slate-900 dark:text-white truncate">
          {{ title || (metricName + ' Radial Gauge') }}
        </div>
        <div class="text-[10px] text-slate-400 font-mono truncate">
          {{ deviceId }} &bull; {{ metricName }}
        </div>
      </div>
    </div>

    <!-- Live Status Pill -->
    <div class="flex items-center gap-1.5 rounded-full border border-slate-200 bg-slate-50 px-2 py-0.5 text-[10px] font-semibold dark:border-slate-800 dark:bg-slate-950">
      <span class="h-1.5 w-1.5 rounded-full" [class.bg-emerald-500]="isConnected()" [class.bg-slate-400]="!isConnected()"></span>
      <span class="text-slate-600 dark:text-slate-400">{{ isConnected() ? 'Live' : 'Cached' }}</span>
    </div>
  </header>

  <!-- Gauge Canvas -->
  <main class="relative flex-1 min-h-[170px] w-full flex items-center justify-center py-2">
    <div #gaugeContainer class="h-full w-full min-h-[170px]"></div>
  </main>

  <!-- Widget Footer -->
  <footer class="flex items-center justify-between pt-2 border-t border-slate-100 text-[10px] text-slate-400 dark:border-slate-800/80">
    <span class="font-mono">Range: {{ min }} - {{ max }} {{ getResolvedUnit() }}</span>
    <span>Updated: {{ lastReceivedTime() || 'Waiting...' }}</span>
  </footer>
</section>
