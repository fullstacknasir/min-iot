<nav
  aria-label="Pagination"
  class="flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-4 text-xs text-slate-600 shadow-sm transition-colors dark:border-slate-800 dark:bg-slate-900/80 dark:text-slate-400 sm:flex-row sm:items-center sm:justify-between"
>
  <!-- Summary and Page Size Selector -->
  <div class="flex flex-wrap items-center gap-3">
    <div class="flex items-center gap-2 font-medium">
      <span>Rows per page:</span>
      <select
        [value]="pageSize"
        (change)="onPageSizeSelect($event)"
        class="rounded-lg border border-slate-300 bg-slate-50 px-2 py-1 text-xs font-semibold text-slate-800 outline-none transition focus:border-cyan-500 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-200"
      >
        <option *ngFor="let option of pageSizeOptions" [value]="option">
          {{ option }}
        </option>
      </select>
    </div>

    <span class="text-slate-400 dark:text-slate-600">|</span>

    <span class="font-medium text-slate-700 dark:text-slate-300">
      Showing <span class="font-semibold text-slate-900 dark:text-white">{{ startItem }}</span> -
      <span class="font-semibold text-slate-900 dark:text-white">{{ endItem }}</span> of
      <span class="font-semibold text-slate-900 dark:text-white">{{ total }}</span>
    </span>
  </div>

  <!-- Page Navigation Buttons -->
  <div class="flex items-center gap-1.5 self-end sm:self-auto">
    <!-- Previous Page Button -->
    <button
      type="button"
      [disabled]="isFirstPage"
      (click)="goToPrevious()"
      class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800"
      aria-label="Previous Page"
    >
      <mat-icon class="text-sm">chevron_left</mat-icon>
    </button>

    <!-- Page Number Buttons -->
    <ng-container *ngFor="let pageNum of getVisiblePages()">
      <button
        type="button"
        (click)="goToPage(pageNum)"
        [class.bg-cyan-600]="pageNum === page"
        [class.text-white]="pageNum === page"
        [class.font-bold]="pageNum === page"
        [class.border-cyan-600]="pageNum === page"
        [class.bg-white]="pageNum !== page"
        [class.text-slate-700]="pageNum !== page"
        [class.dark:bg-slate-900]="pageNum !== page"
        [class.dark:text-slate-300]="pageNum !== page"
        [class.dark:border-slate-800]="pageNum !== page"
        class="inline-flex h-8 min-w-[2rem] items-center justify-center rounded-lg border px-2 text-xs transition hover:bg-slate-100 dark:hover:bg-slate-800"
      >
        {{ pageNum }}
      </button>
    </ng-container>

    <!-- Next Page Button -->
    <button
      type="button"
      [disabled]="isLastPage"
      (click)="goToNext()"
      class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800"
      aria-label="Next Page"
    >
      <mat-icon class="text-sm">chevron_right</mat-icon>
    </button>
  </div>
</nav>
