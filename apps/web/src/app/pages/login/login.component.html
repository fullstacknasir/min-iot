<main class="flex min-h-screen items-center justify-center bg-slate-950 px-4 py-12">
  <section class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/90 p-8 shadow-2xl backdrop-blur">
    <header class="text-center">
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-tr from-cyan-600 to-indigo-600 text-white shadow-lg shadow-cyan-500/20">
        <mat-icon class="text-3xl">developer_board</mat-icon>
      </div>
      <div class="mt-4 text-2xl font-bold tracking-tight text-white">minIoT Platform</div>
      <p class="mt-1 text-sm text-slate-400">Enterprise IoT Telemetry & Device Operations</p>
    </header>

    <main class="mt-8">
      <div *ngIf="errorMessage()" class="mb-5 flex items-center gap-2 rounded-xl border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-400">
        <mat-icon class="text-base">error_outline</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Email Address</label>
          <div class="relative mt-2">
            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
              <mat-icon class="text-base">mail_outline</mat-icon>
            </span>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              placeholder="user@example.com"
              class="w-full rounded-xl border border-slate-800 bg-slate-950 py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 transition-colors focus:border-cyan-500 focus:outline-none"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Password</label>
          <div class="relative mt-2">
            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
              <mat-icon class="text-base">lock_outline</mat-icon>
            </span>
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              required
              placeholder="••••••••••••"
              class="w-full rounded-xl border border-slate-800 bg-slate-950 py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 transition-colors focus:border-cyan-500 focus:outline-none"
            />
          </div>
        </div>

        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 py-3 text-sm font-semibold text-white shadow-lg shadow-cyan-500/20 transition-all hover:opacity-95 disabled:opacity-50"
        >
          <mat-icon *ngIf="isSubmitting()" class="animate-spin text-base">sync</mat-icon>
          <span>{{ isSubmitting() ? 'Signing In...' : 'Sign In' }}</span>
        </button>
      </form>
    </main>

    <footer class="mt-6 border-t border-slate-800/80 pt-5 text-center">
      <button
        type="button"
        (click)="fillDemoCredentials()"
        class="inline-flex items-center gap-1.5 text-xs font-medium text-cyan-400 hover:text-cyan-300 transition-colors"
      >
        <mat-icon class="text-xs">key</mat-icon>
        <span>Fill Demo Admin Credentials (admin@miniot.io)</span>
      </button>
    </footer>
  </section>
</main>
