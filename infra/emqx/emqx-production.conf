# ==========================================================
# minIoT EMQX 5 Production Configuration
# TLS / SSL Encrypted MQTT (8883) & WSS (8084) Listeners
# HTTP Authentication, Authorization & Event Webhooks
# ==========================================================

node {
  name = "miniot-prod@127.0.0.1"
  cookie = "miniot_production_cookie_change_in_prod"
  data_dir = "data"
}

dashboard {
  listeners.http {
    bind = 18083
  }
}

# ----------------------------------------------------------
# Plain Listeners (TCP & WebSocket)
# ----------------------------------------------------------
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 102400
}

# ----------------------------------------------------------
# Secure TLS / SSL Listeners (MQTTS & WSS)
# ----------------------------------------------------------
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 1024000
  ssl_options {
    cacertfile = "etc/certs/cacert.pem"
    certfile = "etc/certs/cert.pem"
    keyfile = "etc/certs/key.pem"
    verify = "verify_none"
    fail_if_no_peer_cert = false
  }
}

listeners.wss.default {
  bind = "0.0.0.0:8084"
  max_connections = 102400
  ssl_options {
    cacertfile = "etc/certs/cacert.pem"
    certfile = "etc/certs/cert.pem"
    keyfile = "etc/certs/key.pem"
  }
}

# ----------------------------------------------------------
# HTTP Authentication: Per-Device Token Validation
# ----------------------------------------------------------
authentication = [
  {
    mechanism = "password_based"
    backend = "http"
    enable = true
    method = "post"
    url = "http://host.docker.internal:8080/api/v1/emqx/auth"
    headers {
      "content-type" = "application/json"
    }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    pool_size = 16
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

# ----------------------------------------------------------
# HTTP Authorization: Topic-Level Publish & Subscribe ACLs
# ----------------------------------------------------------
authorization {
  no_match = "deny"
  deny_action = "ignore"
  cache {
    enable = true
    max_size = 1024
    ttl = "1m"
  }
  sources = [
    {
      type = "http"
      enable = true
      method = "post"
      url = "http://host.docker.internal:8080/api/v1/emqx/acl"
      headers {
        "content-type" = "application/json"
      }
      body {
        clientid = "${clientid}"
        username = "${username}"
        action = "${action}"
        topic = "${topic}"
      }
      pool_size = 16
      connect_timeout = "5s"
      request_timeout = "5s"
    }
  ]
}

# ----------------------------------------------------------
# Event Webhooks: Connect / Disconnect Status Tracking
# ----------------------------------------------------------
bridges {
  webhook {
    emqx_events {
      enable = true
      url = "http://host.docker.internal:8080/api/v1/emqx/events"
      method = "post"
      headers {
        "content-type" = "application/json"
      }
      body = "${.}"
      pool_size = 16
      connect_timeout = "5s"
      request_timeout = "5s"
    }
  }
}

rule_engine {
  rules {
    device_events {
      enable = true
      sql = "SELECT * FROM \"$events/client_connected\", \"$events/client_disconnected\""
      actions = [
        "webhook:emqx_events"
      ]
    }
  }
}
